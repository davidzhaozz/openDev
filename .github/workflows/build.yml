# macOS build + smoke. This is the macOS edition; the Windows edition and its
# CI live on the windows-develop / windows-release branches.
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: macos
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty and keytar are native. `npm ci` builds or fetches prebuilds
      # for the runner's own platform, which is what the smoke test needs.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Electron bundles)
        run: npm run build

      - name: Build (headless server + web renderer)
        run: npm run web:build

      # Exercises the real main-process code — filesystem, git, ripgrep, port
      # enumeration, a live PTY, Python detection — on macOS.
      - name: Headless smoke
        run: node scripts/smoke-headless.mjs

      # Package the real .app (unsigned — the Developer ID cert stays on the
      # Mac) and prove it carries no Windows payload and its native modules
      # load. Catches the 0.7.20 failure: a Windows keytar.node in a Mac build.
      - name: Package (unsigned) + verify Mac-only payload
        run: |
          npx electron-builder --mac --dir --config electron-builder.yml -c.mac.identity=null
          node scripts/verify-mac-build.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VERIFY_SKIP_KEYCHAIN: '1'
