# Enforces the release flow: the release branch only accepts pull requests
# from develop.
#
#   develop -> release
#
# The repository ruleset on the release branches requires this check, so a
# PR from any other branch can't merge.
# pull_request_target runs the copy of this file on the *base* branch, so a
# PR can't weaken the rule by editing it. Nothing from the PR is checked out.
name: branch-guard

on:
  pull_request_target:
    branches: [release]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  branch-guard:
    name: branch-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          case "$BASE" in
            release) allowed=develop ;;
            *) echo "No rule for $BASE"; exit 0 ;;
          esac
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD" != "$allowed" ]; then
            echo "::error::$BASE only accepts pull requests from $allowed (this one is from $HEAD_REPO:$HEAD)."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"
